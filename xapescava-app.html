<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xapes de Cava</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f7f3ee;--card:#fff;--text:#2b2b2b;--muted:#6b6b6b;--accent:#8a1538;--border:#e2dcd3;
  --tinc:#4caf50;--rep:#2196f3;--busco:#ff9800;--no:#9e9e9e;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1c1a18;--card:#2a2725;--text:#eee;--muted:#aaa;--border:#3a362f}
}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#2a2725;--text:#eee;--muted:#aaa;--border:#3a362f}
*{box-sizing:border-box}
html{scroll-padding-top:var(--sat)}
body{
  margin:0;padding-top:var(--sat);padding-bottom:var(--sab);
  font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)
}
a{color:var(--accent)}
header{
  position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;
  padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem
}
header h1{margin:0;font-size:1.15rem;cursor:pointer}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem}
nav button{
  background:none;border:1px solid rgba(255,255,255,.5);color:#fff;
  padding:.3rem .8rem;border-radius:16px;cursor:pointer;font-size:.85rem
}
nav button.actiu{background:#fff;color:var(--accent)}
#auth-box{
  max-width:400px;margin:2.5rem auto;background:var(--card);
  padding:1.5rem;border-radius:12px;border:1px solid var(--border)
}
#auth-box h2{margin-top:0}
#auth-box input{
  width:100%;padding:.6rem;margin:.35rem 0;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);color:var(--text)
}
.auth-tabs{display:flex;gap:.4rem;margin-bottom:.8rem}
.auth-tab{
  flex:1;padding:.45rem;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem
}
.auth-tab.actiu{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primari{
  width:100%;padding:.65rem;margin-top:.4rem;border:none;border-radius:6px;
  background:var(--accent);color:#fff;cursor:pointer;font-weight:600
}
.btn-secundari{
  width:100%;padding:.6rem;margin-top:.4rem;border-radius:6px;
  background:transparent;color:var(--accent);border:1px solid var(--accent);cursor:pointer
}
.oauth-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.6rem}
.btn-oauth{
  padding:.55rem;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem
}
#msg{color:var(--accent);font-size:.9rem;min-height:1.2em;margin:.4rem 0}
.barra{
  padding:.8rem 1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
  max-width:1100px;margin:0 auto
}
.barra input, .barra select{
  padding:.45rem .6rem;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--text)
}
#cerca{flex:1;min-width:180px}
#resum{
  display:flex;gap:.8rem;padding:0 1rem .8rem;flex-wrap:wrap;font-size:.85rem;
  max-width:1100px;margin:0 auto
}
.resum-chip{
  background:var(--card);border:1px solid var(--border);border-radius:999px;
  padding:.35rem .8rem;display:inline-flex;align-items:center;gap:.35rem;
  cursor:pointer;text-decoration:none;color:var(--text)
}
.resum-chip:hover{border-color:var(--accent)}
.resum-chip.actiu{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:0 1rem 2rem;max-width:1100px;margin:0 auto}
.grup h2{border-bottom:2px solid var(--border);padding-bottom:.3rem;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem}
.xapa{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.65rem;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:.35rem
}
.xapa:hover{border-color:var(--accent)}
.xapa .cercle{
  width:100%;aspect-ratio:1;border-radius:50%;background:var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:.72rem;color:var(--muted)
}
.xapa .cercle img{width:100%;height:100%;object-fit:cover}
.xapa .marca-nom{
  font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.xapa .codi{font-size:.72rem;color:var(--muted)}
.estats{display:flex;justify-content:center;gap:.25rem;margin-top:auto}
.estats button{
  width:22px;height:22px;border-radius:4px;border:1px solid var(--border);
  cursor:pointer;opacity:.35
}
.estats button.on{opacity:1}
.b-tinc{background:var(--tinc)}.b-rep{background:var(--rep)}.b-busco{background:var(--busco)}.b-no{background:var(--no)}
.buit{color:var(--muted);padding:2rem;text-align:center}
.sentinel{
  text-align:center;padding:1.2rem;color:var(--muted);font-size:.85rem
}
.detall{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:1.2rem;margin-top:1rem
}
.detall h2{margin-top:.5rem}
.fila{display:flex;gap:2rem;flex-wrap:wrap;margin-top:.8rem}
.fitxa-img{
  width:160px;aspect-ratio:1;border-radius:50%;background:var(--border);
  overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.fitxa-img img{width:100%;height:100%;object-fit:cover}
.camps dt{color:var(--muted);font-size:.8rem;margin-top:.5rem}
.camps dd{margin:0;font-size:.95rem}
.posseidors{list-style:none;padding:0}
.posseidors li{padding:.4rem 0;border-bottom:1px solid var(--border)}
.unitats-ctrl{display:flex;align-items:center;gap:.5rem;margin:.6rem 0}
.unitats-ctrl button{
  width:32px;height:32px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;font-size:1.1rem
}
.chip{
  display:inline-block;padding:.35rem .8rem;border-radius:16px;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  cursor:pointer;font-size:.85rem;text-decoration:none;margin-right:.3rem;margin-top:.3rem
}
.chip.on{background:var(--busco);color:#fff;border-color:var(--busco)}
.chip.off-on{background:var(--no);color:#fff;border-color:var(--no)}
.perfil-stats{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0}
.stat-link{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:.5rem .85rem;cursor:pointer;font-size:.9rem;color:var(--text)
}
.stat-link:hover{border-color:var(--accent)}
.stat-link.actiu{background:var(--accent);color:#fff;border-color:var(--accent)}
#sortir{
  background:none;border:1px solid #fff;color:#fff;
  padding:.3rem .8rem;border-radius:6px;cursor:pointer
}
textarea{
  width:100%;padding:.5rem;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;margin-top:.5rem
}
</style>
</head>
<body>

<div id="auth-box" style="display:none">
  <h2>Xapes de Cava</h2>
  <div class="auth-tabs">
    <button id="tab-pass" class="auth-tab actiu" onclick="canviaModeAuth('pass')">Contrasenya</button>
    <button id="tab-magic" class="auth-tab" onclick="canviaModeAuth('magic')">Enllaç màgic</button>
    <button id="tab-otp" class="auth-tab" onclick="canviaModeAuth('otp')">Codi OTP</button>
  </div>
  <p id="msg"></p>
  <input id="email" type="email" placeholder="Correu electrònic" onkeydown="if(event.key==='Enter')accioAuthPrincipal()">
  <div id="bloc-pass">
    <input id="pass" type="password" placeholder="Contrasenya" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn-primari" onclick="entrar()">Entrar</button>
    <button class="btn-secundari" onclick="registrar()">Crear compte</button>
  </div>
  <div id="bloc-magic" style="display:none">
    <button class="btn-primari" onclick="enviarMagicLink()">Enviar enllaç màgic al correu</button>
  </div>
  <div id="bloc-otp" style="display:none">
    <button class="btn-secundari" onclick="enviarOtp()">Enviar codi de 6 dígits</button>
    <input id="codi-otp" type="text" inputmode="numeric" maxlength="8" placeholder="Introdueix el codi rebut" onkeydown="if(event.key==='Enter')verificarOtp()">
    <button class="btn-primari" onclick="verificarOtp()">Verificar codi</button>
  </div>
  <div class="oauth-grid">
    <button class="btn-oauth" onclick="entrarOAuth('google')">Continuar amb Google</button>
    <button class="btn-oauth" onclick="entrarOAuth('github')">Continuar amb GitHub</button>
  </div>
  <p style="font-size:.8rem;color:var(--muted);margin-top:.8rem">
    <a href="#cataleg" onclick="event.preventDefault();tancarLogin()">← Tornar al catàleg sense sessió</a>
  </p>
</div>

<div id="app" style="display:none">
  <header>
    <h1 onclick="navega('cataleg')">🍾 Xapes de Cava</h1>
    <nav>
      <button data-v="cataleg" onclick="navega('cataleg')">Catàleg global</button>
      <button id="nav-meu" data-v="meu" onclick="navega('meu')" style="display:none">El meu catàleg</button>
      <button id="nav-perfil" data-v="perfil" onclick="navegaMeuPerfil()" style="display:none">El meu perfil</button>
      <span id="usuari-badge" style="font-size:.8rem;opacity:.9;margin-left:.3rem;display:none"></span>
      <button id="sortir" onclick="sortir()" style="display:none">Tancar sessió</button>
      <button id="entrar-nav" onclick="mostrarLogin()">Iniciar sessió</button>
    </nav>
  </header>

  <div class="barra">
    <input id="cerca" placeholder="Cerca per codi, marca o edició..." oninput="reiniciarLlista()">
    <select id="filtre-categoria" onchange="reiniciarLlista()"><option value="">Totes les categories</option></select>
    <select id="filtre-marca" onchange="reiniciarLlista()"><option value="">Totes les marques</option></select>
    <select id="filtre-estat" onchange="reiniciarLlista()" style="display:none">
      <option value="">Qualsevol estat</option>
      <option value="tinc">Tinc</option>
      <option value="repetida">Repetides</option>
      <option value="busco">Busco</option>
    </select>
    <input id="cerca-usuari" placeholder="Cerca un usuari..." oninput="cercarUsuaris()" style="max-width:160px">
    <div id="resultats-usuari" style="position:relative"></div>
  </div>

  <div id="resum"></div>
  <main id="main"><p class="buit">Carregant...</p></main>
</div>

<script>
const SUPABASE_URL = "https://kvbeopgynanymlmugrvb.supabase.co";
const SUPABASE_KEY = "sb_publishable_xlyA52KpOJKIXEU5wO4hww_BUtkSCEO";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MIDA_LOT = 20;
let dades = [];
let dadesFiltrades = [];
let mostrats = 0;
let usuariActual = null;
let modeAuth = "pass";
let observerScroll = null;

function msg(t){ document.getElementById("msg").textContent = t; }

function canviaModeAuth(mode){
  modeAuth = mode;
  msg("");
  document.querySelectorAll(".auth-tab").forEach(b => b.classList.remove("actiu"));
  document.getElementById("tab-" + mode).classList.add("actiu");
  document.getElementById("bloc-pass").style.display = mode === "pass" ? "block" : "none";
  document.getElementById("bloc-magic").style.display = mode === "magic" ? "block" : "none";
  document.getElementById("bloc-otp").style.display = mode === "otp" ? "block" : "none";
}

function accioAuthPrincipal(){
  if (modeAuth === "pass") entrar();
  else if (modeAuth === "magic") enviarMagicLink();
  else if (modeAuth === "otp") enviarOtp();
}

async function registrar(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("pass").value;
  const { error } = await sb.auth.signUp({ email, password });
  msg(error ? error.message : "Compte creat. Revisa el correu si cal confirmar-lo i després entra.");
}

async function entrar(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("pass").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { msg(error.message); return; }
  await mostrarApp(true);
}

async function enviarMagicLink(){
  const email = document.getElementById("email").value.trim();
  if (!email) { msg("Escriu un correu electrònic primer."); return; }
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  msg(error ? error.message : "T'hem enviat un enllaç d'accés al correu.");
}

async function enviarOtp(){
  const email = document.getElementById("email").value.trim();
  if (!email) { msg("Escriu un correu electrònic primer."); return; }
  const { error } = await sb.auth.signInWithOtp({ email });
  msg(error ? error.message : "Codi enviat al correu. Introdueix-lo a sota.");
}

async function verificarOtp(){
  const email = document.getElementById("email").value.trim();
  const token = document.getElementById("codi-otp").value.trim();
  const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
  if (error) { msg(error.message); return; }
  await mostrarApp(true);
}

async function entrarOAuth(provider){
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) msg(error.message);
}

function mostrarLogin(){
  msg("");
  document.getElementById("app").style.display = "none";
  document.getElementById("auth-box").style.display = "block";
  document.getElementById("email").focus();
}

function tancarLogin(){
  document.getElementById("auth-box").style.display = "none";
  document.getElementById("app").style.display = "block";
  if (!location.hash) location.hash = "cataleg";
  enrutar();
}

async function sortir(){
  await sb.auth.signOut();
  usuariActual = null;
  if (location.hash === "#meu" || location.hash.startsWith("#usuari-")) location.hash = "cataleg";
  await mostrarApp(false);
}

async function mostrarApp(){
  const { data: { session } } = await sb.auth.getSession();
  usuariActual = session?.user || null;
  document.getElementById("auth-box").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("sortir").style.display = usuariActual ? "inline-block" : "none";
  document.getElementById("nav-meu").style.display = usuariActual ? "inline-block" : "none";
  document.getElementById("nav-perfil").style.display = usuariActual ? "inline-block" : "none";
  document.getElementById("entrar-nav").style.display = usuariActual ? "none" : "inline-block";

  const badge = document.getElementById("usuari-badge");
  if (usuariActual) {
    badge.textContent = usuariActual.email;
    badge.style.display = "inline";
  } else {
    badge.style.display = "none";
  }

  await carregarFiltres();
  if (!location.hash) location.hash = "cataleg";
  enrutar();
}

function navegaMeuPerfil(){
  if (!usuariActual) { mostrarLogin(); return; }
  location.hash = `usuari-${usuariActual.id}`;
}

let filtresCarregats = false;
async function carregarFiltres(){
  if (filtresCarregats) return;
  const { data: cats } = await sb.from("categories").select("nom").order("ordre");
  const selCat = document.getElementById("filtre-categoria");
  selCat.innerHTML = '<option value="">Totes les categories</option>';
  (cats || []).forEach(c => selCat.insertAdjacentHTML("beforeend", `<option value="${c.nom}">${c.nom}</option>`));

  const { data: marques } = await sb.from("marques").select("nom").order("nom");
  const selMarca = document.getElementById("filtre-marca");
  selMarca.innerHTML = '<option value="">Totes les marques</option>';
  const noms = [...new Set((marques || []).map(m => m.nom))];
  noms.forEach(n => selMarca.insertAdjacentHTML("beforeend", `<option value="${n}">${n}</option>`));
  filtresCarregats = true;
}

window.addEventListener("hashchange", enrutar);

function enrutar(){
  const h = location.hash.replace("#", "") || "cataleg";
  if (h === "meu" && !usuariActual) { mostrarLogin(); return; }

  document.querySelectorAll("nav button[data-v]").forEach(b => {
    const actiu = b.dataset.v === h || (b.dataset.v === "perfil" && h.startsWith("usuari-"));
    b.classList.toggle("actiu", actiu);
  });

  const esCatalegOLlista = h === "cataleg" || h === "meu";
  document.querySelector(".barra").style.display = esCatalegOLlista ? "flex" : "none";
  document.getElementById("resum").style.display = esCatalegOLlista ? "flex" : "none";
  document.getElementById("filtre-estat").style.display = h === "meu" ? "inline-block" : "none";

  if (h.startsWith("xapa-")) return mostrarFitxaXapa(h.replace("xapa-", ""));
  if (h.startsWith("usuari-")) {
    const parts = h.replace("usuari-", "").split("/");
    return mostrarPerfil(parts[0], parts[1] || "tinc");
  }
  carregarCataleg(h === "meu");
}

function navega(v){ location.hash = v; }

async function carregarResum(){
  if (!usuariActual){ document.getElementById("resum").innerHTML = ""; return; }
  const { data } = await sb.from("v_resum_usuari").select("*").maybeSingle();
  const r = document.getElementById("resum");
  const estatActual = document.getElementById("filtre-estat").value;
  r.innerHTML = `
    <button class="resum-chip ${estatActual==='tinc'?'actiu':''}" onclick="filtrarDesDeResum('tinc')">Tinc: ${data?.total_tinc || 0}</button>
    <button class="resum-chip ${estatActual==='repetida'?'actiu':''}" onclick="filtrarDesDeResum('repetida')">Repetides: ${data?.total_repetides || 0}</button>
    <button class="resum-chip ${estatActual==='busco'?'actiu':''}" onclick="filtrarDesDeResum('busco')">Busco: ${data?.total_busco || 0}</button>
  `;
}

function filtrarDesDeResum(estat){
  if (location.hash !== "#meu") location.hash = "meu";
  const sel = document.getElementById("filtre-estat");
  sel.value = sel.value === estat ? "" : estat;
  carregarCataleg(true);
}

async function carregarCataleg(nomesMeu){
  document.getElementById("main").innerHTML = '<p class="buit">Carregant...</p>';
  let q = sb.from("v_cataleg_usuari").select("*").order("marca");
  if (nomesMeu) q = q.not("estat", "is", null);
  const { data, error } = await q;
  if (error){
    document.getElementById("main").innerHTML = `<p class="buit">Error carregant: ${error.message}</p>`;
    return;
  }
  dades = data || [];
  await carregarResum();
  reiniciarLlista();
}

function reiniciarLlista(){
  const terme = document.getElementById("cerca").value.toLowerCase();
  const cat = document.getElementById("filtre-categoria").value;
  const marca = document.getElementById("filtre-marca").value;
  const estat = document.getElementById("filtre-estat").value;

  dadesFiltrades = dades.filter(x =>
    (!terme || `${x.codi} ${x.marca} ${x.nom_edicio || ""}`.toLowerCase().includes(terme)) &&
    (!cat || x.categoria === cat) &&
    (!marca || x.marca === marca) &&
    (!estat || x.estat === estat)
  );

  mostrats = 0;
  pintarLot(true);
}

function pintarLot(reinicia){
  const main = document.getElementById("main");
  if (!dadesFiltrades.length){
    main.innerHTML = '<p class="buit">No hi ha xapes per mostrar.</p>';
    return;
  }

  mostrats = Math.min(dadesFiltrades.length, mostrats + MIDA_LOT);
  const subllista = dadesFiltrades.slice(0, mostrats);

  const grups = {};
  subllista.forEach(x => (grups[x.marca || "Sense marca"] ||= []).push(x));

  const hiHaMes = mostrats < dadesFiltrades.length;
  main.innerHTML = Object.keys(grups).sort().map(m => `
    <div class="grup">
      <h2>${m}</h2>
      <div class="grid">${grups[m].map(fitxaXapa).join("")}</div>
    </div>`).join("") + `
    <div id="scroll-sentinel" class="sentinel">
      ${hiHaMes ? `Mostrant ${mostrats} de ${dadesFiltrades.length} xapes · Fes scroll per carregar-ne 20 més` : `Mostrant totes les ${dadesFiltrades.length} xapes`}
    </div>`;

  if (observerScroll) observerScroll.disconnect();
  if (hiHaMes) {
    observerScroll = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        observerScroll.disconnect();
        pintarLot(false);
      }
    }, { rootMargin: "200px" });
    const sent = document.getElementById("scroll-sentinel");
    if (sent) observerScroll.observe(sent);
  }
}

function renderCercle(imatgeUrl, marca, codi){
  const altText = marca || codi || "Xapa";
  const fallback = marca || codi || "—";
  if (imatgeUrl) {
    return `<img referrerpolicy="no-referrer" src="${imatgeUrl}" alt="${altText}" onerror="this.remove();this.parentNode.textContent='${fallback.replace(/'/g,"\\'")}'">`;
  }
  return fallback;
}

function fitxaXapa(x){
  return `
    <div class="xapa" onclick="location.hash='xapa-${x.id}'">
      <div class="cercle">${renderCercle(x.imatge_url, x.marca, x.codi)}</div>
      <div class="marca-nom">${x.marca || "Sense marca"}</div>
      <div class="codi">${x.codi}${x.num_variant > 1 ? " ·v" + x.num_variant : ""}</div>
      ${usuariActual ? `
      <div class="estats" onclick="event.stopPropagation()">
        <button class="b-tinc ${x.estat==='tinc'?'on':''}" title="Tinc" onclick="marcarUnitats(${x.id}, x=>x.estat==='tinc'?0:1)"></button>
        <button class="b-rep ${x.estat==='repetida'?'on':''}" title="Repetida" onclick="marcarUnitats(${x.id}, x=>x.estat==='repetida'?1:2)"></button>
        <button class="b-busco ${x.estat==='busco'?'on':''}" title="Busco" onclick="marcarInteres(${x.id},'busco')"></button>
        <button class="b-no ${x.estat==='no_interessa'?'on':''}" title="No interessa" onclick="marcarInteres(${x.id},'no_interessa')"></button>
      </div>` : ""}
    </div>`;
}

async function marcarUnitats(xapaId, calc){
  if (!usuariActual) return;
  const x = dades.find(d => d.id === xapaId);
  const unitats = calc(x);
  await sb.from("usuari_xapes").upsert(
    { usuari_id: usuariActual.id, xapa_id: xapaId, unitats, interes: null },
    { onConflict: "usuari_id,xapa_id" }
  );
  await carregarCataleg(location.hash.replace("#", "") === "meu");
}

async function marcarInteres(xapaId, interes){
  if (!usuariActual) return;
  const x = dades.find(d => d.id === xapaId);
  const nou = x.estat === interes ? null : interes;
  await sb.from("usuari_xapes").upsert(
    { usuari_id: usuariActual.id, xapa_id: xapaId, unitats: 0, interes: nou },
    { onConflict: "usuari_id,xapa_id" }
  );
  await carregarCataleg(location.hash.replace("#", "") === "meu");
}

async function mostrarFitxaXapa(id){
  const main = document.getElementById("main");
  main.innerHTML = '<p class="buit">Carregant fitxa...</p>';
  const { data: x, error } = await sb.from("v_cataleg_usuari").select("*").eq("id", id).maybeSingle();
  if (error || !x){ main.innerHTML = '<p class="buit">No s\'ha trobat la xapa.</p>'; return; }
  const { data: posseidors } = await sb.from("v_posseidors_xapa").select("*").eq("xapa_id", id);

  main.innerHTML = `
    <div class="detall">
      <button class="chip" onclick="history.back()">&larr; Tornar</button>
      <div class="fila">
        <div class="fitxa-img">${x.imatge_url ? `<img referrerpolicy="no-referrer" src="${x.imatge_url}" alt="${x.marca || x.codi}" onerror="this.remove()">` : (x.marca || x.codi)}</div>
        <div style="flex:1;min-width:220px">
          <h2>${x.marca || "Sense marca"}${x.codi ? " — " + x.codi : ""}${x.nom_edicio ? " (" + x.nom_edicio + ")" : ""}</h2>
          <dl class="camps">
            <dt>Marca</dt><dd>${x.marca || "—"}</dd>
            <dt>Categoria</dt><dd>${x.categoria || "—"}</dd>
            <dt>Any d'expedició</dt><dd>${x.any_expedicio || "—"}</dd>
            <dt>País d'origen</dt><dd>${x.pais_origen || "—"}</dd>
            <dt>Descripció</dt><dd>${x.descripcio || "—"}</dd>
            ${x.url_externa ? `<dt>Enllaç extern</dt><dd><a href="${x.url_externa}" target="_blank" rel="noopener">${x.url_externa}</a></dd>` : ""}
          </dl>
        </div>
      </div>

      ${usuariActual ? `
      <h3>La meva informació</h3>
      <div class="unitats-ctrl">
        <button onclick="canviUnitats(${x.id}, -1)">−</button>
        <span>Unitats: <strong id="num-unitats">${x.unitats || 0}</strong></span>
        <button onclick="canviUnitats(${x.id}, 1)">+</button>
      </div>
      <div>
        <span class="chip ${x.interes==='busco'?'on':''}" onclick="marcarInteresFitxa(${x.id},'busco')">La busco</span>
        <span class="chip ${x.interes==='no_interessa'?'off-on':''}" onclick="marcarInteresFitxa(${x.id},'no_interessa')">No m'interessa</span>
      </div>
      <textarea id="comentaris-personal" rows="2" placeholder="Comentaris personals...">${x.usuari_comentaris || ""}</textarea>
      <button class="chip" onclick="desarComentari(${x.id})">Desar comentari</button>
      ` : `<p class="buit">Inicia sessió per marcar aquesta xapa a la teva col·lecció.</p>`}

      <h3>Usuaris que la tenen</h3>
      <ul class="posseidors">
        ${(posseidors || []).length ? posseidors.map(p => `<li><a href="#usuari-${p.usuari_id}/tinc">${p.nom_usuari || "usuari"}</a> — ${p.unitats} unitat(s)</li>`).join("") : '<li class="buit">Ningú més l\'ha marcada com a pública encara.</li>'}
      </ul>
    </div>`;
}

async function canviUnitats(xapaId, delta){
  const actuals = parseInt(document.getElementById("num-unitats").textContent) || 0;
  const noves = Math.max(0, actuals + delta);
  await sb.from("usuari_xapes").upsert(
    { usuari_id: usuariActual.id, xapa_id: xapaId, unitats: noves, interes: noves > 0 ? null : undefined },
    { onConflict: "usuari_id,xapa_id" }
  );
  mostrarFitxaXapa(xapaId);
}

async function marcarInteresFitxa(xapaId, interes){
  await sb.from("usuari_xapes").upsert(
    { usuari_id: usuariActual.id, xapa_id: xapaId, unitats: 0, interes },
    { onConflict: "usuari_id,xapa_id" }
  );
  mostrarFitxaXapa(xapaId);
}

async function desarComentari(xapaId){
  const text = document.getElementById("comentaris-personal").value;
  await sb.from("usuari_xapes").upsert(
    { usuari_id: usuariActual.id, xapa_id: xapaId, comentaris: text },
    { onConflict: "usuari_id,xapa_id" }
  );
}

async function mostrarPerfil(usuariId, tipusActiu){
  const main = document.getElementById("main");
  main.innerHTML = '<p class="buit">Carregant perfil...</p>';

  const { data: perfil } = await sb.from("perfils").select("*").eq("id", usuariId).maybeSingle();
  const { data: coleccio, error } = await sb.from("v_cataleg_de_usuari").select("*").eq("usuari_id", usuariId);
  if (error){
    main.innerHTML = `<p class="buit">Error: ${error.message}</p>`;
    return;
  }

  const items = coleccio || [];
  const xapesTinc = items.filter(x => (x.unitats || 0) >= 1 || x.estat === "tinc" || x.estat === "repetida");
  const xapesRepetides = items.filter(x => (x.unitats || 0) >= 2 || x.estat === "repetida");
  const xapesBusco = items.filter(x => x.interes === "busco" || x.estat === "busco");

  const llistes = {
    tinc: xapesTinc,
    repetides: xapesRepetides,
    busco: xapesBusco
  };
  const titols = {
    tinc: "Xapes que té",
    repetides: "Xapes repetides",
    busco: "Xapes que busca"
  };

  const seleccionada = llistes[tipusActiu] ? tipusActiu : "tinc";
  const llistaActual = llistes[seleccionada];

  main.innerHTML = `
    <div class="detall">
      <button class="chip" onclick="history.back()">&larr; Tornar</button>
      <h2>${perfil?.nom_usuari || "Usuari"}</h2>
      <div class="perfil-stats">
        <a class="stat-link ${seleccionada==='tinc'?'actiu':''}" href="#usuari-${usuariId}/tinc">
          Xapes que té: <strong>${xapesTinc.length}</strong>
        </a>
        <a class="stat-link ${seleccionada==='repetides'?'actiu':''}" href="#usuari-${usuariId}/repetides">
          Repetides: <strong>${xapesRepetides.length}</strong>
        </a>
        <a class="stat-link ${seleccionada==='busco'?'actiu':''}" href="#usuari-${usuariId}/busco">
          Busco: <strong>${xapesBusco.length}</strong>
        </a>
      </div>
      <h3>${titols[seleccionada]} (${llistaActual.length})</h3>
      <div class="grid">
        ${llistaActual.map(x => `
          <div class="xapa" onclick="location.hash='xapa-${x.xapa_id || x.id}'">
            <div class="cercle">${renderCercle(x.imatge_url, x.marca, x.codi)}</div>
            <div class="marca-nom">${x.marca || "Sense marca"}</div>
          </div>`).join("") || '<p class="buit">No hi ha xapes en aquesta secció.</p>'}
      </div>
    </div>`;
}

async function cercarUsuaris(){
  const terme = document.getElementById("cerca-usuari").value.trim();
  const cont = document.getElementById("resultats-usuari");
  if (terme.length < 2){ cont.innerHTML = ""; return; }
  const { data } = await sb.from("perfils").select("id,nom_usuari").ilike("nom_usuari", `%${terme}%`).limit(8);
  cont.innerHTML = (data || []).length ? `
    <div style="position:absolute;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:.3rem;z-index:20;min-width:180px">
      ${data.map(p => `<div style="padding:.35rem .55rem;cursor:pointer" onclick="location.hash='usuari-${p.id}/tinc';document.getElementById('resultats-usuari').innerHTML=''">${p.nom_usuari}</div>`).join("")}
    </div>` : "";
}

sb.auth.getSession().then(({ data: { session } }) => mostrarApp(!!session));
</script>
</body>
</html>
